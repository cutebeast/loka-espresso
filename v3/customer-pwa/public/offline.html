<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loka Espresso - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F2EEE6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1B2023;
    }
    .card {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 48px 32px;
      text-align: center;
      max-width: 320px;
      width: 90%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 999px;
      background: #E8EDE0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 32px;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #1B2023;
    }
    p {
      font-size: 14px;
      color: #6A7A8A;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    button {
      background: #384B16;
      color: #FFFFFF;
      border: none;
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">☕</div>
    <h1 id="offline-title">You're offline</h1>
    <p id="offline-body">Please check your internet connection and try again.</p>
    <button id="offline-retry" onclick="location.reload()">Retry</button>
  </div>
  <script>
    (function(){
      var lang = (navigator.language || 'en').slice(0,2);
      var dict = {
        en: { title: "You're offline", body: "Please check your internet connection and try again.", retry: "Retry" },
        ms: { title: "Anda luar talian", body: "Sila periksa sambungan internet anda dan cuba lagi.", retry: "Cuba lagi" },
        zh: { title: "您已离线", body: "请检查您的互联网连接并重试。", retry: "重试" },
        ta: { title: "நீங்கள் ஆஃப்லைனில் உள்ளீர்கள்", body: "உங்கள் இணைய இணைப்பைச் சரிபார்த்து மீண்டும் முயற்சிக்கவும்.", retry: "மீண்டும் முயற்சிக்கவும்" },
        tr: { title: "Çevrimdışısınız", body: "Lütfen internet bağlantınızı kontrol edip tekrar deneyin.", retry: "Tekrar dene" }
      };
      var t = dict[lang] || dict.en;
      document.getElementById('offline-title').textContent = t.title;
      document.getElementById('offline-body').textContent = t.body;
      document.getElementById('offline-retry').textContent = t.retry;
    })();
  </script>
</body>
</html>
