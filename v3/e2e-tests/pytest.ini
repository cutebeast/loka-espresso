[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --durations=10
timeout = 60

markers =
    smoke: Quick health check on core endpoints
    admin: Admin API tests
    customer: Customer flow tests
    staff: Staff flow tests
    slow: Tests that take longer than 10 seconds
