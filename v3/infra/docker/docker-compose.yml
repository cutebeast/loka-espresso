version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fnb-v3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fnb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-fnb_enterprise_v3}
    ports:
      - "13334:5432"
    volumes:
      - fnb_v3_db_data:/var/lib/postgresql/data
      - ../db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fnb_user} -d ${POSTGRES_DB:-fnb_enterprise_v3}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fnb_v3_network

  redis:
    image: redis:7-alpine
    container_name: fnb-v3-redis
    restart: unless-stopped
    ports:
      - "13335:6379"
    volumes:
      - fnb_v3_redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-redis_dev_password} ping 2>/dev/null || redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fnb_v3_network

  backend:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/Dockerfile.backend
    container_name: fnb-v3-backend
    restart: unless-stopped
    ports:
      - "13800:13800"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fnb_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fnb_enterprise_v3}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — minimum 32 characters}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:13830,http://localhost:13810,http://localhost:13820}
    volumes:
      - fnb_v3_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fnb_v3_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13800/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin-portal:
    build:
      context: ../../admin-portal
      dockerfile: ../infra/docker/Dockerfile.admin
    container_name: fnb-v3-admin
    restart: unless-stopped
    ports:
      - "13830:3000"
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fnb_v3_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5

  customer-pwa:
    build:
      context: ../../customer-pwa
      dockerfile: ../infra/docker/Dockerfile.customer
    container_name: fnb-v3-customer
    restart: unless-stopped
    ports:
      - "13810:13810"
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fnb_v3_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13810/"]
      interval: 15s

  staff-portal:
    build:
      context: ../../staff-portal
      dockerfile: ../infra/docker/Dockerfile.staff
    container_name: fnb-v3-staff
    restart: unless-stopped
    ports:
      - "13820:3000"
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fnb_v3_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: fnb-v3-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../../infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - fnb_v3_uploads:/app/uploads:ro
      - fnb_v3_caddy_data:/data
      - fnb_v3_caddy_config:/config
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@lokaespresso.my}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.lokaespresso.my}
    depends_on:
      backend:
        condition: service_healthy
      admin-portal:
        condition: service_healthy
      customer-pwa:
        condition: service_healthy
      staff-portal:
        condition: service_healthy
    networks:
      - fnb_v3_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health" 2>/dev/null || echo healthy]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  fnb_v3_network:
    driver: bridge

volumes:
  fnb_v3_db_data:
  fnb_v3_redis_data:
  fnb_v3_uploads:
  fnb_v3_caddy_data:
  fnb_v3_caddy_config:
