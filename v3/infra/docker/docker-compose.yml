version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fnb-v3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fnb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-fnb_enterprise_v3}
    ports:
      - "13334:5432"
    volumes:
      - fnb_v3_db_data:/var/lib/postgresql/data
      - ../db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fnb_user} -d ${POSTGRES_DB:-fnb_enterprise_v3}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fnb-v3-redis
    restart: unless-stopped
    ports:
      - "13335:6379"
    volumes:
      - fnb_v3_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: fnb-v3-backend
    restart: unless-stopped
    ports:
      - "13800:13800"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fnb_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fnb_enterprise_v3}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — minimum 32 characters}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: "http://localhost:13801,http://localhost:13802,http://localhost:13803"
    volumes:
      - fnb_v3_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13800/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin-portal:
    build:
      context: ../../admin-portal
      dockerfile: ../docker/Dockerfile.admin
    container_name: fnb-v3-admin
    restart: unless-stopped
    ports:
      - "13801:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:13800/api/v1
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5

  customer-pwa:
    build:
      context: ../../customer-pwa
      dockerfile: ../docker/Dockerfile.customer
    container_name: fnb-v3-customer
    restart: unless-stopped
    ports:
      - "13802:3012"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:13800/api/v1
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5

  staff-portal:
    build:
      context: ../../staff-portal
      dockerfile: ../docker/Dockerfile.staff
    container_name: fnb-v3-staff
    restart: unless-stopped
    ports:
      - "13803:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:13800/api/v1
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  fnb_v3_db_data:
  fnb_v3_redis_data:
  fnb_v3_uploads:
