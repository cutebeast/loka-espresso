# F&B POS Customer Display — {$POS_DISP_DOMAIN:pos-disp.loyaltysystem.uk}
https://{$POS_DISP_DOMAIN:pos-disp.loyaltysystem.uk} {
    tls {$TLS_CERT_PATH:/etc/ssl/certs/loyaltysystem-origin.pem} {$TLS_KEY_PATH:/etc/ssl/private/loyaltysystem-origin.key} {
        protocols tls1.2
    }

    # Static Next.js assets → staff portal UNTOUCHED (no rewrite) —
    # without this the catchall rewrites chunks to HTML and the page never hydrates
    handle /_next/* {
        reverse_proxy localhost:13850
    }

    # API proxy → v3 backend (display-state polling, store config)
    handle /api/* {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }

    # Uploads → v3 backend (store branding on the idle screen)
    handle /uploads/* {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }

    handle {
        rewrite * /pos/display?{query}
        reverse_proxy localhost:13850
    }

    log {
        output file /var/log/caddy/fnb-pos-disp.log
        # Strip query strings from logged URIs (guest-pay links carry JWTs).
        format filter {
            wrap json
            fields {
                request>uri regexp "\?.*" ""
            }
        }
    }
}

http://{$POS_DISP_DOMAIN:pos-disp.loyaltysystem.uk} {
    handle /_next/* {
        reverse_proxy localhost:13850
    }

    handle /api/* {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }

    handle /uploads/* {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }

    handle {
        rewrite * /pos/display?{query}
        reverse_proxy localhost:13850
    }
}
