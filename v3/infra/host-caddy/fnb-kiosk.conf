# F&B Self-Ordering Kiosk — {$KIOSK_DOMAIN:kiosk.loyaltysystem.uk}
https://{$KIOSK_DOMAIN:kiosk.loyaltysystem.uk} {
    tls {$TLS_CERT_PATH:/etc/ssl/certs/loyaltysystem-origin.pem} {$TLS_KEY_PATH:/etc/ssl/private/loyaltysystem-origin.key} {
        protocols tls1.2
    }

    # API proxy → v3 backend
    handle /api/* {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }

    # Health check
    handle /health {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }

    # Uploads
    handle /uploads/* {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }

    handle {
        reverse_proxy localhost:13840
    }

    log {
        output file /var/log/caddy/fnb-kiosk.log
        # Strip query strings from logged URIs (guest-pay links carry JWTs).
        format filter {
            wrap json
            fields {
                request>uri regexp "\?.*" ""
            }
        }
    }
}

http://{$KIOSK_DOMAIN:kiosk.loyaltysystem.uk} {
    handle /api/* {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }
    handle /health {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }
    handle /uploads/* {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }
    handle {
        reverse_proxy localhost:13840
    }
}
