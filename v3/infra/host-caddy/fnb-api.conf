# F&B API Endpoint — {$API_DOMAIN:api.loyaltysystem.uk}
# External-only entry point: webhooks, third-party integrations, future mobile apps.
# Internal portal traffic continues through each portal's own /api proxy (not this host).

https://{$API_DOMAIN:api.loyaltysystem.uk} {
    tls {$TLS_CERT_PATH:/etc/ssl/certs/loyaltysystem-origin.pem} {$TLS_KEY_PATH:/etc/ssl/private/loyaltysystem-origin.key} {
        protocols tls1.2
    }

    reverse_proxy localhost:13800 {
        header_up Host localhost
    }

    log {
        output file /var/log/caddy/fnb-api.log
        # Strip query strings from logged URIs (guest-pay links carry JWTs).
        format filter {
            wrap json
            fields {
                request>uri regexp "\?.*" ""
            }
        }
    }
}

http://{$API_DOMAIN:api.loyaltysystem.uk} {
    reverse_proxy localhost:13800 {
        header_up Host localhost
    }
}
