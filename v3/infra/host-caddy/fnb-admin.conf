# F&B Admin Portal v3 — {$ADMIN_DOMAIN:admin.loyaltysystem.uk}
https://{$ADMIN_DOMAIN:admin.loyaltysystem.uk} {
    tls {$TLS_CERT_PATH:/etc/ssl/certs/loyaltysystem-origin.pem} {$TLS_KEY_PATH:/etc/ssl/private/loyaltysystem-origin.key} {
        protocols tls1.2
    }

    # API proxy → v3 backend
    handle /api/* {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }

    # Swagger/docs
    handle /docs {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }
    handle /openapi.json {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }
    handle /redoc {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }

    # Health check
    handle /health {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }

    # Uploads — proxy to v3 backend so the backend StaticFiles mount serves them
    handle /uploads/* {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }

    # Everything else → v3 admin portal (Next.js on port 13830)
    handle {
        reverse_proxy localhost:13830
    }

    log {
        output file /var/log/caddy/fnb-admin.log
    }
}

# HTTP — proxy directly (Cloudflare Flexible SSL)
http://{$ADMIN_DOMAIN:admin.loyaltysystem.uk} {
    handle /api/* {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }
    handle /docs {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }
    handle /openapi.json {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }
    handle /redoc {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }
    handle /health {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }
    handle /uploads/* {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }
    handle {
        reverse_proxy localhost:13830
    }
}
