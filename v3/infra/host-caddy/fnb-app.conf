# F&B Customer PWA v3 — app.loyaltysystem.uk
https://app.loyaltysystem.uk {
    tls /etc/ssl/certs/loyaltysystem-origin.pem /etc/ssl/private/loyaltysystem-origin.key {
        protocols tls1.2
    }

    # CORS for version.json
    handle /version.json {
        header Access-Control-Allow-Origin *
        header Access-Control-Allow-Methods "GET, OPTIONS"
        header Access-Control-Allow-Headers "Content-Type"
        root * /root/fnb-super-app/v3/customer-pwa/public
        file_server
    }

    # API proxy → v3 backend
    handle /api/* {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }

    # Health check
    handle /health {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }

    # Uploads — proxy to v3 backend so the backend StaticFiles mount serves them
    handle /uploads/* {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }

    # Everything else → v3 customer PWA (Next.js on port 13810)
    handle {
        reverse_proxy localhost:13810
    }

    log {
        output file /var/log/caddy/fnb-app.log
    }
}

# HTTP — proxy directly (Cloudflare Flexible SSL)
http://app.loyaltysystem.uk {
    handle /api/* {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }
    handle /health {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }
    handle /uploads/* {
        reverse_proxy localhost:13800 {
            header_up Host localhost
        }
    }
    handle {
        reverse_proxy localhost:13810
    }
}
